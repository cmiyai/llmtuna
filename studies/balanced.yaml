# Balanced study — maximize throughput with a latency SLA.
# Use case: RAG service, API endpoint with response time guarantees.
# Workload: moderate concurrency, medium inputs, medium outputs.
# Trials where p95 TTFT > latency_cap_ms are pruned.

study:
  name: "qwen3_30b_balanced"
  n_trials: 30
  n_startup_trials: 5
  strategy: "balanced"
  latency_cap_ms: 200

server:
  model: "RedHatAI/Qwen3-30B-A3B-FP8-dynamic"
  tensor_parallel_size: 2
  startup_timeout: 300

benchmark:
  max_seconds: 120
  rate: 20
  rate_type: "concurrent"
  data:
    prompt_tokens: 2000
    output_tokens: 1000

parameters:
  max_num_batched_tokens:
    min: 2048
    max: 131072
    step: 4096
  enable_cuda_graphs: true

static_params:
  disable-log-requests: true

env_vars:
  VLLM_USE_V1: "1"
