# High throughput study — maximize output tokens/sec.
# Use case: batch summarization, eval pipelines, data extraction.
# Workload: high concurrency, long inputs, short outputs.

study:
  name: "qwen3_30b_throughput"
  n_trials: 30
  n_startup_trials: 5
  strategy: "high_throughput"

server:
  model: "RedHatAI/Qwen3-30B-A3B-FP8-dynamic"
  tensor_parallel_size: 2
  startup_timeout: 300

benchmark:
  max_seconds: 120
  rate: 50
  rate_type: "concurrent"
  data:
    prompt_tokens: 4000
    output_tokens: 500

parameters:
  max_num_batched_tokens:
    min: 2048
    max: 131072
    step: 4096
  enable_cuda_graphs: true

static_params:
  disable-log-requests: true

env_vars:
  VLLM_USE_V1: "1"
